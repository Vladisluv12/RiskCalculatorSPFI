upstream streamlit_pool {
    # ip_hash = sticky sessions: один клиент всегда идёт на один контейнер.
    # Критично для Streamlit — сессия хранится in-process.
    ip_hash;

    server streamlit1:8501;
    server streamlit2:8501;
    server streamlit3:8501;
}

server {
    listen 80;

    location / {
        proxy_pass http://streamlit_pool;

        # WebSocket support (Streamlit требует обязательно)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streamlit держит WebSocket соединение долго
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Streamlit healthcheck endpoint
    location /_stcore/health {
        proxy_pass http://streamlit_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
