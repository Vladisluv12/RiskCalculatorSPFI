services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      streamlit1:
        condition: service_healthy
      streamlit2:
        condition: service_healthy
      streamlit3:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  streamlit1:
    build: .
    environment:
      DATA_DIR: /app/src/data
    volumes:
      - ./src/data/currency:/app/src/data/currency:ro
      - ./src/data/curves:/app/src/data/curves:ro
      - ./src/data/fixings:/app/src/data/fixings:ro
      - ./src/data/ois_curves:/app/src/data/ois_curves:ro
      - ./src/data/ir:/app/src/data/ir:ro
      - ./src/data/sample_portfolios:/app/src/data/sample_portfolios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  streamlit2:
    build: .
    environment:
      DATA_DIR: /app/src/data
    volumes:
      - ./src/data/currency:/app/src/data/currency:ro
      - ./src/data/curves:/app/src/data/curves:ro
      - ./src/data/fixings:/app/src/data/fixings:ro
      - ./src/data/ois_curves:/app/src/data/ois_curves:ro
      - ./src/data/ir:/app/src/data/ir:ro
      - ./src/data/sample_portfolios:/app/src/data/sample_portfolios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  streamlit3:
    build: .
    environment:
      DATA_DIR: /app/src/data
    volumes:
      - ./src/data/currency:/app/src/data/currency:ro
      - ./src/data/curves:/app/src/data/curves:ro
      - ./src/data/fixings:/app/src/data/fixings:ro
      - ./src/data/ois_curves:/app/src/data/ois_curves:ro
      - ./src/data/ir:/app/src/data/ir:ro
      - ./src/data/sample_portfolios:/app/src/data/sample_portfolios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  certbot-webroot:
  certbot-certs:
